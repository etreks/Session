name: Build and Release APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Rename APK for Release
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/Session-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-assets/Session-v1.0.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk release-assets/Session-v1.0.apk
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: session-apk
          path: release-assets/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Session v1.0 🚀"
          body: |
            ## 📱 Session v1.0 — Download & Install

            An indie stopwatch and activity tracker app built with Kotlin, Jetpack Compose, and Material Design 3.
            Inspired by Google Clock and Google Calendar.

            ### 📥 Download Links
            - **[Session-v1.0.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/Session-v1.0.apk)** (Direct APK download)
            
            ### 📱 How to Install:
            1. Download the `.apk` on your Android device.
            2. Tap the downloaded file in your browser or Downloads folder.
            3. When prompted, toggle **Allow from this source** (or "Install Unknown Apps").
            4. Tap **Install** and enjoy!
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
